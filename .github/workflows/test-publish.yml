name: Publish to TestPyPI

# Runs on every push to main -- a low-friction, frequent sanity check
# that the package still builds and uploads correctly, unlike the
# real-PyPI workflow, which only fires on a deliberate GitHub Release.
on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Append a unique dev suffix to the version
        # TestPyPI rejects re-uploading the same version, same as real
        # PyPI. Appending the run number lets every push to main succeed
        # without manually bumping pyproject.toml each time.
        run: |
          sed -i -E "s/^version = \"([0-9]+\.[0-9]+\.[0-9]+)\"/version = \"\1.dev${{ github.run_number }}\"/" pyproject.toml
          grep "^version" pyproject.toml

      - name: Install build tool
        run: python -m pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/