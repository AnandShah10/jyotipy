name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Mirrors the requires-python range in pyproject.toml. Testing
        # the oldest and newest supported versions catches the two most
        # likely breakage points (deprecated stdlib usage on the new end,
        # missing features on the old end) without matrixing every
        # version in between.
        python-version: ["3.8", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -v
